[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentos-backend"
version = "0.1.0"
description = "AgentOS: action-taking, self-verifying AI agent platform backend (modular monolith + durable workers)."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "email-validator>=2.2,<3",
  "sqlalchemy[asyncio]>=2.0.36,<2.2",
  "asyncpg>=0.30,<1",
  "alembic>=1.14,<2",
  "pgvector>=0.3.6,<1",
  "redis>=5.2,<9",
  "httpx>=0.27,<1",
  "argon2-cffi>=23.1,<26",
  "pyjwt[crypto]>=2.9,<3",
  "cryptography>=43,<51",
  "prometheus-client>=0.21,<1",
  "opentelemetry-api>=1.28,<2",
  "opentelemetry-sdk>=1.28,<2",
  "croniter>=3.0,<7",
  "jsonschema>=4.23,<5",
  "python-multipart>=0.0.18,<1",
  "boto3>=1.35,<2",
  "pypdf>=5.1,<7",
]

[project.optional-dependencies]
# Browser workers only. API/worker images do not need Chromium.
browser = ["playwright>=1.49,<2"]
otlp = ["opentelemetry-exporter-otlp-proto-http>=1.28,<2"]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1",
  "mypy>=1.13,<3",
]
load = ["locust>=2.32,<3"]

[project.scripts]
agentos-worker = "app.workers.worker:main"
agentos-scheduler = "app.workers.scheduler.scheduler:main"
agentos-browser-worker = "app.browser.worker:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "PT"]
ignore = [
  "S101",   # asserts are fine in tests
  "B008",   # FastAPI Depends() in defaults is idiomatic
  "RUF012", # mutable class attrs on pydantic/SQLAlchemy models are declarative
  "S105",   # enum/constant names that contain "token"/"secret" are not secrets
  "S106",
  "UP042",  # (str, Enum) kept for explicit JSON behaviour
  "UP046",
  "UP047",
  "RUF001",
  "RUF002",
  "RUF003",
  "ASYNC109", # explicit timeout parameters are intentional (propagated to httpx/asyncio.wait_for)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "ASYNC", "PT011", "PT012", "PT018", "E501"]
"scripts/**" = ["S"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true
exclude = ["migrations/", "tests/load/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
  "integration: requires PostgreSQL and Redis",
  "security: security-focused tests",
  "e2e: end-to-end task lifecycle tests",
  "browser: requires Playwright + Chromium",
  "contract: provider/tool contract tests",
]
filterwarnings = ["ignore::DeprecationWarning:passlib.*"]

[tool.coverage.run]
source = ["app"]
omit = ["app/workers/worker.py", "app/browser/worker.py"]
