# Cluster-internal Service for the API; exposed publicly only through ingress.yaml.
apiVersion: v1
kind: Service
metadata:
  name: agentos-api
  labels:
    app.kubernetes.io/name: agentos
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: agentos
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
