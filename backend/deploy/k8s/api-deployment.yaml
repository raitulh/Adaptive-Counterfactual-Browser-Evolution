# AgentOS API (stateless; scale horizontally). Probes:
#   /api/v1/live  – process is up (startup + liveness; never touches dependencies)
#   /api/v1/ready – PostgreSQL, Redis, queue table and migrations reachable (readiness)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentos-api
  labels:
    app.kubernetes.io/name: agentos
    app.kubernetes.io/component: api
  annotations:
    # GKE Workload Identity (deploy/terraform output `workload_service_accounts.api`).
    iam.gke.io/gcp-service-account: agentos-api@your-gcp-project.iam.gserviceaccount.com
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentos-api
  labels:
    app.kubernetes.io/name: agentos
    app.kubernetes.io/component: api
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 25%
  selector:
    matchLabels:
      app.kubernetes.io/name: agentos
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentos
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: agentos-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: agentos
              app.kubernetes.io/component: api
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: agentos
              app.kubernetes.io/component: api
      containers:
        - name: api
          image: agentos-backend
          imagePullPolicy: IfNotPresent
          # No --forwarded-allow-ips flag: uvicorn then trusts FORWARDED_ALLOW_IPS from the
          # ConfigMap (the ingress controller's range) instead of every peer.
          command: ["uvicorn"]
          args:
            - --factory
            - app.main:app_factory
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --proxy-headers
            - --no-server-header
            - --timeout-keep-alive
            - "75"
            - --timeout-graceful-shutdown
            - "25"
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: agentos-config
            - secretRef:
                name: agentos-secrets
          env:
            - name: OTEL_SERVICE_NAME
              value: agentos-api
          resources:
            # CPU limit intentionally unset (avoids throttling latency spikes); the HPA scales on
            # CPU utilisation of the request. On GKE Autopilot limits default to requests.
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /api/v1/live
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/v1/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              # Let endpoint removal propagate to the ingress before uvicorn stops accepting.
              exec:
                command: ["python", "-c", "import time; time.sleep(5)"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            # With Memorystore in-transit encryption, mount its CA and reference it from
            # REDIS_URL (?ssl_ca_certs=/etc/agentos/redis-ca/server-ca.pem):
            # - name: redis-ca
            #   mountPath: /etc/agentos/redis-ca
            #   readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        # - name: redis-ca
        #   secret:
        #     secretName: agentos-redis-ca
