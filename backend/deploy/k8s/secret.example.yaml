# EXAMPLE ONLY — NOT part of kustomization.yaml and contains NO real values.
#
# Every AgentOS process reads the Secret `agentos-secrets` (envFrom). Create it in ONE of
# two ways:
#
#   A. (recommended) External Secrets Operator syncs it from Google Secret Manager.
#      The Terraform in deploy/terraform creates the Secret Manager secrets (without
#      values) and a `agentos-secrets-sync` Google service account with read access.
#      Add values with:
#        printf '%s' "$VALUE" | gcloud secrets versions add agentos-jwt-secret --data-file=-
#      then apply documents 1-3 below (after installing External Secrets Operator).
#      Every secret referenced in document 3 must have at least one version, otherwise the
#      sync fails: delete the entries you do not use (e.g. SEARCH_API_KEY, SMTP_PASSWORD).
#
#   B. (development clusters only) a plain Secret (document 4), created from a local file
#      that is never committed:
#        kubectl -n agentos create secret generic agentos-secrets --from-env-file=prod.env
#
# Key reference (all values are secrets; see .env.example for formats):
#   DATABASE_URL              postgresql+asyncpg://agentos:<password>@<private-ip>:5432/agentos?ssl=require
#   REDIS_URL                 rediss://:<auth-string>@<private-ip>:6378/0?ssl_ca_certs=/etc/agentos/redis-ca/server-ca.pem
#                             (or redis://:<auth-string>@<private-ip>:6379/0 without in-transit encryption)
#   JWT_SECRET                python -c "import secrets; print(secrets.token_urlsafe(64))"
#   TOKEN_ENCRYPTION_KEY      python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
#   TOKEN_ENCRYPTION_PREVIOUS_KEYS  empty, or old keys during a rotation (docs/operations.md)
#   GEMINI_API_KEY, GOOGLE_CLIENT_SECRET, OBJECT_STORAGE_ACCESS_KEY, OBJECT_STORAGE_SECRET_KEY,
#   SEARCH_API_KEY, SMTP_PASSWORD, WEBHOOK_SIGNING_SECRET, METRICS_BEARER_TOKEN, SENTRY_DSN
---
# 1. Service account used by External Secrets Operator to read Secret Manager
#    (GKE Workload Identity → the `agentos-secrets-sync` Google service account).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentos-secrets-sync
  namespace: agentos
  annotations:
    iam.gke.io/gcp-service-account: agentos-secrets-sync@your-gcp-project.iam.gserviceaccount.com
automountServiceAccountToken: false
---
# 2. Where the secrets come from.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: gcp-secret-manager
  namespace: agentos
spec:
  provider:
    gcpsm:
      projectID: your-gcp-project
      auth:
        workloadIdentity:
          clusterLocation: europe-west1
          clusterName: agentos
          serviceAccountRef:
            name: agentos-secrets-sync
---
# 3. What to sync into the `agentos-secrets` Kubernetes Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentos-secrets
  namespace: agentos
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: gcp-secret-manager
  target:
    name: agentos-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef: {key: agentos-database-url}
    - secretKey: REDIS_URL
      remoteRef: {key: agentos-redis-url}
    - secretKey: JWT_SECRET
      remoteRef: {key: agentos-jwt-secret}
    - secretKey: TOKEN_ENCRYPTION_KEY
      remoteRef: {key: agentos-token-encryption-key}
    - secretKey: TOKEN_ENCRYPTION_PREVIOUS_KEYS
      remoteRef: {key: agentos-token-encryption-previous-keys}
    - secretKey: GEMINI_API_KEY
      remoteRef: {key: agentos-gemini-api-key}
    - secretKey: GOOGLE_CLIENT_SECRET
      remoteRef: {key: agentos-google-client-secret}
    - secretKey: OBJECT_STORAGE_ACCESS_KEY
      remoteRef: {key: agentos-object-storage-access-key}
    - secretKey: OBJECT_STORAGE_SECRET_KEY
      remoteRef: {key: agentos-object-storage-secret-key}
    - secretKey: SEARCH_API_KEY
      remoteRef: {key: agentos-search-api-key}
    - secretKey: SMTP_PASSWORD
      remoteRef: {key: agentos-smtp-password}
    - secretKey: WEBHOOK_SIGNING_SECRET
      remoteRef: {key: agentos-webhook-signing-secret}
    - secretKey: METRICS_BEARER_TOKEN
      remoteRef: {key: agentos-metrics-bearer-token}
    - secretKey: SENTRY_DSN
      remoteRef: {key: agentos-sentry-dsn}
---
# 4. Alternative for development clusters: a plain Secret. Every value below is a
#    placeholder that fails startup validation on purpose; never commit real values.
apiVersion: v1
kind: Secret
metadata:
  name: agentos-secrets
  namespace: agentos
type: Opaque
stringData:
  DATABASE_URL: "REPLACE_ME"
  REDIS_URL: "REPLACE_ME"
  JWT_SECRET: "REPLACE_ME"
  TOKEN_ENCRYPTION_KEY: "REPLACE_ME"
  TOKEN_ENCRYPTION_PREVIOUS_KEYS: ""
  GEMINI_API_KEY: "REPLACE_ME"
  GOOGLE_CLIENT_SECRET: "REPLACE_ME"
  OBJECT_STORAGE_ACCESS_KEY: "REPLACE_ME"
  OBJECT_STORAGE_SECRET_KEY: "REPLACE_ME"
  SEARCH_API_KEY: ""
  SMTP_PASSWORD: ""
  WEBHOOK_SIGNING_SECRET: ""
  METRICS_BEARER_TOKEN: ""
  SENTRY_DSN: ""
