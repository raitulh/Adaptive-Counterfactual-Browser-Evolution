# AgentOS web CI: contract check, types, lint, unit tests and production build; then the
# Playwright end-to-end suite against the real API + worker (scripted model, simulated Google).
name: web-ci

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "backend/**"
      - "acbe/**"
      - ".github/workflows/web-ci.yml"
  pull_request:
    paths:
      - "web/**"
      - "backend/**"
      - "acbe/**"
      - ".github/workflows/web-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: contract, types, lint, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Generated API client matches backend/docs/openapi.json
        run: npm run api:check

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

      - name: Production build
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          # .next/ minus the dev/cache output; `next start` in the e2e job serves it.
          path: |
            web/.next
            !web/.next/cache
            !web/.next/dev
          include-hidden-files: true
          retention-days: 3

  e2e:
    name: end-to-end (Playwright)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: agentos
          POSTGRES_PASSWORD: agentos
          POSTGRES_DB: agentos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentos -d agentos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      APP_ENV: development
      # CI-only service containers; not secrets. e2e_backend.py uses its own agentos_e2e database.
      DATABASE_URL: postgresql+asyncpg://agentos:agentos@localhost:5432/agentos
      REDIS_URL: redis://localhost:6379/0
      E2E_PYTHON: python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            backend/pyproject.toml

      - name: Install the backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ..
          python -m pip install -e .

      - name: Generate ephemeral secrets for this run
        run: |
          jwt="$(python -c 'import secrets; print(secrets.token_urlsafe(64))')"
          key="$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          echo "::add-mask::$jwt"
          echo "::add-mask::$key"
          {
            echo "JWT_SECRET=$jwt"
            echo "TOKEN_ENCRYPTION_KEY=$key"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci --no-audit --no-fund

      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: web/.next

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Playwright
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
